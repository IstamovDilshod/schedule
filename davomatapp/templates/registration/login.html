{% extends "davomatapp/base.html" %}
{% block title %}Kirish{% endblock %}
{% block content %}
<style>
  .auth-card { max-width:430px; margin:56px auto; text-align:center; padding:34px 30px; }
  .auth-ico { width:64px; height:64px; margin:0 auto 14px; border-radius:20px; display:grid; place-items:center; font-size:34px;
              color:#fff; background:linear-gradient(135deg,#818cf8,#4f46e5); box-shadow:0 12px 28px rgba(79,70,229,.35); }
  .auth-card form { text-align:left; margin-top:20px; }
  .auth-card input[type=text], .auth-card input[type=password] { max-width:none; }
  .auth-card .btn { width:100%; justify-content:center; padding:11px; }
  .auth-switch { margin-top:18px; font-size:14px; }
  .auth-switch a { color:#4f46e5; font-weight:600; text-decoration:none; }
  .auth-switch a:hover { text-decoration:underline; }
</style>
<div class="card auth-card">
  <div class="auth-ico"><iconify-icon icon="solar:lock-keyhole-minimalistic-bold-duotone"></iconify-icon></div>
  <h1>Xush kelibsiz</h1>
  <p class="muted">Davomat tizimiga kirish uchun login va parolingizni kiriting.</p>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <button class="btn" type="submit"><iconify-icon icon="solar:login-2-bold-duotone"></iconify-icon> Kirish</button>
  </form>
  <p class="muted auth-switch">Akkauntingiz yo'qmi? <a href="{% url 'register' %}">Ro'yxatdan o'tish</a></p>
</div>
{% endblock %}
